<form>

    <fieldset>

        <legend>Iniciar sesión</legend>

        <label for="correo">
            Correo electrónico
        </label>

        <input
            type="email" required 
            id="correo"
            placeholder="ejemplo@correo.com">

        <br><br>

        <label for="password">
            Contraseña
        </label>

        <input
            type="password" required 
            id="password"
            placeholder="********">

        <br><br>

        <button type="submit">
            Entrar
        </button>

    </fieldset>

</form>
